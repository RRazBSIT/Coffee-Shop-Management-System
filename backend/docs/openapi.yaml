openapi: 3.0.3

info:
  title: MR Cafe API
  version: 1.0.0
  description: |
    MR Cafe Coffee Shop Management System API.
    Includes customer ordering, POS, inventory,
    payments, kitchen management and authentication.

servers:
  - url: http://localhost:5000/api
    description: Local development server

tags:
  - name: Health
  - name: Authentication
  - name: Dashboard
  - name: Products
  - name: Orders
  - name: Inventory
  - name: Payments
  - name: Customers

paths:

  /products/categories:
    get:
      tags:
        - Products
      summary: Get product categories
      description: Returns all active product categories.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Categories retrieved successfully.
        '401':
          description: Unauthorized

  /products:
    get:
      tags:
        - Products
      summary: List products
      description: Returns products with their sizes and prices.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: categoryId
          schema:
            type: integer
        - in: query
          name: availability
          schema:
            type: string
            enum: [available, unavailable, all]
      responses:
        '200':
          description: Products retrieved successfully.
        '401':
          description: Unauthorized

    post:
      tags:
        - Products
      summary: Create product
      description: Admin only. Creates a product with its sizes.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - productName
                - sizes
              properties:
                categoryId:
                  type: integer
                productName:
                  type: string
                description:
                  type: string
                  nullable: true
                imageUrl:
                  type: string
                  nullable: true
                isAvailable:
                  type: boolean
                  default: true
                sizes:
                  type: array
                  items:
                    type: object
                    required:
                      - sizeName
                      - price
                    properties:
                      sizeName:
                        type: string
                      price:
                        type: number
                      isAvailable:
                        type: boolean
                        default: true
      responses:
        '201':
          description: Product created successfully.
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '409':
          description: Product already exists

  /products/{id}:
    get:
      tags:
        - Products
      summary: Get product details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Product retrieved successfully.
        '404':
          description: Product not found

    put:
      tags:
        - Products
      summary: Update product
      description: Admin only. Updates product details and sizes.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - productName
                - sizes
              properties:
                categoryId:
                  type: integer
                productName:
                  type: string
                description:
                  type: string
                  nullable: true
                imageUrl:
                  type: string
                  nullable: true
                isAvailable:
                  type: boolean
                sizes:
                  type: array
                  items:
                    type: object
                    required:
                      - sizeName
                      - price
                    properties:
                      sizeName:
                        type: string
                      price:
                        type: number
                      isAvailable:
                        type: boolean
      responses:
        '200':
          description: Product updated successfully.
        '404':
          description: Product not found

  /products/{id}/availability:
    patch:
      tags:
        - Products
      summary: Update product availability
      description: Admin only.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isAvailable
              properties:
                isAvailable:
                  type: boolean
      responses:
        '200':
          description: Product availability updated successfully.
        '404':
          description: Product not found

  /health:
    get:
      tags:
        - Health
      summary: Check API and database status
      responses:
        '200':
          description: API is running

  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fullName
                - email
                - password
              properties:
                fullName:
                  type: string
                  example: Juan Dela Cruz
                email:
                  type: string
                  example: juan@example.com
                phone:
                  type: string
                  example: "09123456789"
                password:
                  type: string
                  format: password
                  example: SecurePass123
      responses:
        '201':
          description: Customer registered successfully
        '400':
          description: Invalid registration information
        '409':
          description: Email already registered

  /auth/customer/login:
    post:
      tags:
        - Authentication
      summary: Customer login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  example: juan@example.com
                password:
                  type: string
                  format: password
                  example: SecurePass123
      responses:
        '200':
          description: Customer login successful
        '401':
          description: Invalid credentials

  /auth/staff/login:
    post:
      tags:
        - Authentication
      summary: Admin or Cashier login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
                  example: SecurePass123
      responses:
        '200':
          description: Staff login successful
        '401':
          description: Invalid credentials

  /auth/staff:
    post:
      tags:
        - Authentication
      summary: Create a Cashier account
      description: Only authenticated Admin users can create Cashier accounts.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - firstName
                - lastName
                - username
                - password
              properties:
                firstName:
                  type: string
                  example: Maria
                lastName:
                  type: string
                  example: Santos
                phone:
                  type: string
                  example: "09123456789"
                username:
                  type: string
                  example: cashier01
                password:
                  type: string
                  format: password
                  example: SecurePass123
      responses:
        '201':
          description: Cashier account created
        '400':
          description: Invalid information
        '401':
          description: Authentication required
        '403':
          description: Admin access required
        '409':
          description: Username already exists

  /dashboard/overview:
    get:
      tags:
        - Dashboard
      summary: Get dashboard overview
      description: |
        Retrieves the Admin Dashboard statistics,
        today's order summary, weekly sales and
        five most recent non-cancelled orders.
        Only authenticated Admin users can access this endpoint.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dashboard overview retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Dashboard overview retrieved successfully.
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          todayRevenue:
                            type: number
                            example: 2500
                          totalOrders:
                            type: number
                            example: 25
                          productsSold:
                            type: number
                            example: 48
                          pendingOrders:
                            type: number
                            example: 3
                      orderSummary:
                        type: object
                        properties:
                          pending:
                            type: integer
                            example: 3
                          preparing:
                            type: integer
                            example: 5
                          ready:
                            type: integer
                            example: 2
                          completed:
                            type: integer
                            example: 15
                      weeklySales:
                        type: array
                        items:
                          type: object
                          properties:
                            day:
                              type: string
                              example: Mon
                            revenue:
                              type: number
                              example: 1200
                      recentOrders:
                        type: array
                        items:
                          type: object
                          properties:
                            orderId:
                              type: integer
                              example: 1
                            orderNumber:
                              type: string
                              example: MC-0001
                            customerName:
                              type: string
                              example: Juan Dela Cruz
                            totalAmount:
                              type: number
                              example: 250
                            status:
                              type: string
                              example: completed
                            orderType:
                              type: string
                              example: dine_in
                            createdAt:
                              type: string
                              format: date-time
        '401':
          description: Authentication token is required or invalid
        '403':
          description: Admin access required
        '500':
          description: Internal server error


  /orders:
    get:
      tags: [Orders]
      summary: List orders
      description: Returns a paginated list of orders. Admin and Cashier access.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, preparing, ready, completed, cancelled]
        - in: query
          name: orderType
          schema:
            type: string
            enum: [dine_in, takeaway]
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Orders retrieved successfully
        '401':
          description: Authentication required
        '403':
          description: Staff access required
    post:
      tags: [Orders]
      summary: Create a POS order
      description: Prices and product details are verified from the database. Creates an unpaid pending order.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderType, items]
              properties:
                orderType:
                  type: string
                  enum: [dine_in, takeaway]
                customerId:
                  type: integer
                  nullable: true
                customerName:
                  type: string
                  nullable: true
                customerPhone:
                  type: string
                  nullable: true
                customerNotes:
                  type: string
                  nullable: true
                discountAmount:
                  type: number
                  minimum: 0
                  default: 0
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sizeId, quantity]
                    properties:
                      sizeId: { type: integer, example: 1 }
                      quantity: { type: integer, minimum: 1, maximum: 99, example: 2 }
                      addonIds:
                        type: array
                        items: { type: integer }
      responses:
        '201':
          description: Order created successfully
        '400':
          description: Invalid order information
        '401':
          description: Authentication required
        '409':
          description: Product or add-on unavailable
  /orders/{id}:
    get:
      tags: [Orders]
      summary: Get order details
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Order details retrieved successfully
        '404':
          description: Order not found
  /orders/{id}/status:
    patch:
      tags: [Orders]
      summary: Update order status
      description: Enforces valid order status transitions. Completion requires a paid payment.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [preparing, ready, completed, cancelled]
                note:
                  type: string
      responses:
        '200':
          description: Order status updated successfully
        '400':
          description: Invalid request
        '404':
          description: Order not found
        '409':
          description: Invalid status transition or unpaid order

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
